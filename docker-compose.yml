x-airflow-common: &airflow-common
  build: ./airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@airflow-db:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    PYTHONPATH: /opt/project
    WAREHOUSE_DSN: postgresql://warehouse:${POSTGRES_PASSWORD}@warehouse:5432/warehouse
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./pipeline:/opt/project/pipeline:ro
    - ./sql:/opt/project/sql:ro
    - ./data:/opt/project/data
    - ./docs:/opt/project/docs
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow -d airflow']
      interval: 5s
      retries: 12

  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: warehouse
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - warehouse_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U warehouse -d warehouse']
      interval: 5s
      retries: 12

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    command: >-
      bash -c 'airflow db migrate &&
      if ! airflow users list --output json | python -c "import json,sys,os; sys.exit(0 if any(u[\"username\"] == os.environ[\"AIRFLOW_ADMIN_USER\"] for u in json.load(sys.stdin)) else 1)";
      then airflow users create --username "$${AIRFLOW_ADMIN_USER}"
      --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Demo --lastname Admin
      --role Admin --email demo@example.com; fi'
    restart: 'no'

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:8502:80'
    volumes:
      - ./docs:/usr/share/nginx/html:ro

volumes:
  airflow_db:
  warehouse_db:
  airflow_logs:
